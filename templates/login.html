<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — CoolBreeze AC</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background: #f8fafc;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      .login-card {
        background: #fff;
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        border: 1px solid #f1f5f9;
      }

      .brand {
        text-align: center;
        margin-bottom: 32px;
      }

      .brand h4 {
        font-weight: 700;
        color: #0f172a;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand p {
        color: #64748b;
        font-size: 13px;
        margin: 6px 0 0;
      }

      .form-label {
        font-size: 13px;
        color: #334155;
        font-weight: 500;
      }

      .form-control {
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        padding: 10px 14px;
        font-size: 14px;
        transition: all 0.2s;
      }

      .form-control:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }

      .btn-login {
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        font-weight: 600;
        width: 100%;
        margin-top: 8px;
        transition: all 0.2s;
      }

      .btn-login:hover {
        background: #4338ca;
        color: #fff;
      }

      .demo-hint {
        background: #f8fafc;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 12px;
        color: #64748b;
        margin-top: 24px;
        text-align: center;
        border: 1px dashed #e2e8f0;
      }

      .demo-hint strong {
        color: #0f172a;
      }

      .error-msg {
        background: #fef2f2;
        border: 1px solid #fee2e2;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        color: #991b1b;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand">
        <h4>
          <i class="bi bi-snow2 text-info me-2"></i>
          CoolBreeze AC
        </h4>
        <p>Customer Portal</p>
      </div>

      {% if form.errors %}
      <div class="error-msg">
        Invalid username or password. Please try again.
      </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Enter your username"
            autofocus
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
          />
        </div>

        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <div class="demo-hint">
        <p class="mb-2"><strong>Test Credentials</strong></p>
        <div class="d-flex justify-content-between mb-1">
          <span>Good User: <code>priya</code></span>
          <span>Password: <code>123</code></span>
        </div>
        <div class="d-flex justify-content-between">
          <span>Fraud User: <code>fraud_test</code></span>
          <span>Password: <code>pass#098</code></span>
        </div>
      </div>
    </div>
  </body>
</html>
