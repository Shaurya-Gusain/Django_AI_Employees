<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}CoolBreeze Dashboard{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #f8fafc;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .status-badge {
        padding: 0.35em 0.75em;
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: 50rem;
        display: inline-block;
        text-transform: capitalize;
      }
      .status-pending {
        background-color: rgba(13, 110, 253, 0.12);
        color: #0b5ed7;
      }
      .status-shipped {
        background-color: rgba(253, 126, 20, 0.12);
        color: #fd7e14;
      }
      .status-delivered {
        background-color: rgba(25, 135, 84, 0.12);
        color: #198754;
      }
      .status-cancelled {
        background-color: rgba(220, 53, 69, 0.12);
        color: #dc3545;
      }
      .badge-purple {
        background-color: rgba(111, 66, 193, 0.12);
        color: #6f42c1;
      }
      .badge-red {
        background-color: rgba(220, 53, 69, 0.12);
        color: #dc3545;
      }
      {% block extra_css %}{% endblock %}
    </style>
  </head>
  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <div
        class="d-flex flex-column flex-shrink-0 p-3 text-white"
        style="width: 240px; min-height: 100vh; background: #0f172a"
      >
        <span class="fs-6 fw-bold mb-3 d-flex align-items-center">
          <i class="bi bi-snow2 text-info me-2 fs-5"></i>
          CoolBreeze AC
        </span>
        <hr style="border-color: rgba(255,255,255,0.15)" />
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="{% url 'dashboard' %}" class="nav-link text-white d-flex align-items-center">
              <i class="bi bi-chat-left-text me-2"></i>
              Conversations
            </a>
          </li>
        </ul>
        <hr style="border-color: rgba(255,255,255,0.15)" />
        <span style="font-size: 11px; opacity: 0.5">Logged in as admin</span>
      </div>

      <!-- Main Content -->
      <div class="flex-grow-1 p-4">
        {% block content %}
        {% endblock %}
      </div>
    </div>
  </body>
</html>
